<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5337f5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rincian Pemesanan">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>Rincian Pemesanan</title>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="rp">Rp.</span><span>Rincian<br>Pemesanan</span></div>
    <nav>
      <button class="nav-item" data-page="dashboard">⌂<span>Dashboard</span><b>›</b></button>
      <button class="nav-item active" data-page="penjualan">🛒<span>Penjualan</span><b>›</b></button>
      <button class="nav-item" data-page="produk">▣<span>Produk</span><b>›</b></button>
      <button class="nav-item" data-page="pelanggan">♙<span>Pelanggan</span><b>›</b></button>
      <button class="nav-item" data-page="ekspedisi">▱<span>Ekspedisi</span><b>›</b></button>
      <button class="nav-item" data-page="resest">↶<span>Resest</span><b>›</b></button>
      <button class="nav-item" data-page="diskon">◇<span>Diskon</span><b>›</b></button>
    </nav>
    <button class="hide-sidebar" id="hideSidebar">‹‹ <span>Sembunyikan</span></button>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger">☰</button>
      <h1 id="pageTitle">Penjualan</h1>
      <div class="search-wrap" id="globalSearchWrap">
        <span>⌕</span>
        <input id="search" type="search" placeholder="Cari produk, kode, atau kategori..." autocomplete="off">
        <kbd>Ctrl + K</kbd>
      </div>
      <button class="icon-btn" title="Notifikasi">♧<i>3</i></button>
      <button class="icon-btn" title="Pasang aplikasi" id="installApp" hidden>⬇</button>
      <button class="icon-btn" title="Layar penuh" id="fullscreen">⛶</button>
      <div class="user"><div class="avatar">👨🏻</div><div><strong>Rizky Ananda</strong><small>Kasir</small></div><span>⌄</span></div>
    </header>

    <section class="content" id="appContent"></section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="./script.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
  }

  let deferredInstallPrompt = null;
  window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    deferredInstallPrompt = event;
    const btn = document.getElementById("installApp");
    if (btn) btn.hidden = false;
  });

  document.addEventListener("click", async (event) => {
    const btn = event.target.closest("#installApp");
    if (!btn || !deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    btn.hidden = true;
  });

  window.addEventListener("appinstalled", () => {
    const btn = document.getElementById("installApp");
    if (btn) btn.hidden = true;
  });
</script>
</body>
</html>
